<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merlin IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🧙 Merlin IA</h1>
      <span class="status" id="status">Conectado</span>
    </header>

    <main>
      <div class="chat" id="chat">
        <!-- Mensagens aparecem aqui -->
      </div>

      <div class="input-area">
        <input type="text" id="question" placeholder="Pergunte ao Merlin...">
        <button id="send">Enviar</button>
      </div>
    </main>

    <footer>
      <button id="terminal-mode">🐧 Modo Terminal</button>
      <button id="documents">📁 Documentos</button>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
