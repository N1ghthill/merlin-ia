name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov aiohttp requests-unixsocket

      - name: Run tests
        run: |
          pytest -v tests/

      - name: Compile modules
        run: |
          python -m compileall merlin_cli.py merlin_api.py rag_indexer.py executor merlin
