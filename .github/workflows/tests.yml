name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest aiohttp requests-unixsocket

      - name: Run tests
        run: |
          pytest -v \
            tests/test_actions_validation.py \
            tests/test_acl.py \
            tests/test_acl_policy.py \
            tests/test_playbook_validation.py \
            tests/test_linux_intents.py \
            tests/test_peer_uid.py
