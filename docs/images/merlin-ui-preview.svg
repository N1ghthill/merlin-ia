<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Merlin IA interface preview</title>
  <desc id="desc">Desktop preview of Merlin IA showing a local chat assistant with RAG and Linux automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121522" />
      <stop offset="100%" stop-color="#1f2739" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22283a" />
      <stop offset="100%" stop-color="#1b2232" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0d15" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />
  <circle cx="1110" cy="130" r="170" fill="#314866" opacity="0.22" />
  <circle cx="140" cy="650" r="210" fill="#284562" opacity="0.20" />
  <path d="M0 120h1280" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M0 260h1280" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M0 400h1280" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M0 540h1280" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M0 680h1280" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M220 0v800" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M430 0v800" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M640 0v800" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M850 0v800" stroke="#44506a" stroke-opacity="0.18" />
  <path d="M1060 0v800" stroke="#44506a" stroke-opacity="0.18" />

  <g filter="url(#shadow)">
    <rect x="130" y="78" width="1020" height="644" rx="24" fill="url(#panel)" stroke="#3e4864" stroke-width="2" />
    <rect x="130" y="78" width="1020" height="74" rx="24" fill="#252c3f" />
    <rect x="130" y="128" width="1020" height="24" fill="#252c3f" />
  </g>

  <circle cx="176" cy="115" r="8" fill="#f7768e" />
  <circle cx="202" cy="115" r="8" fill="#e0af68" />
  <circle cx="228" cy="115" r="8" fill="#9ece6a" />

  <text x="262" y="122" fill="#7aa2f7" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Merlin IA</text>

  <rect x="943" y="98" width="156" height="34" rx="17" fill="#1a1f2e" />
  <circle cx="977" cy="115" r="6" fill="#9ece6a" />
  <text x="995" y="122" fill="#c0caf5" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Local / Ready</text>

  <rect x="170" y="185" width="224" height="56" rx="16" fill="#1a2232" stroke="#34415c" />
  <text x="194" y="208" fill="#7aa2f7" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Offline-first</text>
  <text x="194" y="228" fill="#a9b1d6" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Ollama + ChromaDB locais</text>

  <rect x="410" y="185" width="224" height="56" rx="16" fill="#1a2232" stroke="#34415c" />
  <text x="434" y="208" fill="#bb9af7" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">RAG documents</text>
  <text x="434" y="228" fill="#a9b1d6" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">PDF, TXT and Markdown</text>

  <rect x="650" y="185" width="224" height="56" rx="16" fill="#1a2232" stroke="#34415c" />
  <text x="674" y="208" fill="#9ece6a" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">Linux Agent</text>
  <text x="674" y="228" fill="#a9b1d6" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Diagnose, install, harden</text>

  <rect x="186" y="282" width="340" height="78" rx="18" fill="#414868" />
  <text x="212" y="313" fill="#c0caf5" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Diagnostique o SSH e resuma os</text>
  <text x="212" y="338" fill="#c0caf5" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">documentos em scrolls/.</text>

  <rect x="606" y="282" width="370" height="166" rx="18" fill="#2a3a4a" />
  <text x="632" y="314" fill="#bb9af7" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">Merlin</text>
  <text x="632" y="343" fill="#c7d1f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">SSH ativo e respondendo.</text>
  <text x="632" y="370" fill="#c7d1f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Encontrei runbooks relevantes em</text>
  <text x="632" y="397" fill="#c7d1f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">2 arquivos e posso seguir com</text>
  <text x="632" y="424" fill="#c7d1f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">hardening em modo seguro.</text>

  <rect x="186" y="404" width="300" height="70" rx="18" fill="#33272f" />
  <text x="212" y="436" fill="#f7768e" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Audit trail</text>
  <text x="212" y="461" fill="#f0c5cc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Dry-run before system changes</text>

  <rect x="186" y="530" width="738" height="72" rx="18" fill="#24283b" stroke="#414868" />
  <text x="214" y="574" fill="#6d7896" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Pergunte ao Merlin sobre documentos ou Linux...</text>

  <rect x="948" y="530" width="164" height="72" rx="18" fill="#7aa2f7" />
  <text x="998" y="574" fill="#1a1b26" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Enviar</text>

  <rect x="350" y="642" width="170" height="42" rx="21" fill="#24283b" stroke="#414868" />
  <text x="388" y="669" fill="#c0caf5" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Terminal mode</text>

  <rect x="542" y="642" width="154" height="42" rx="21" fill="#24283b" stroke="#414868" />
  <text x="582" y="669" fill="#c0caf5" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Documents</text>

  <text x="170" y="742" fill="#93a0c4" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Desktop preview based on the Electron UI shipped in this repository.</text>
</svg>
